# Run configuration for one cortical-column simulation + analysis.
# Edit and re-run main.py.  Inline comments give the unit of each parameter.

model: aeif              # categorical: 'iaf' or 'aeif'
abeta_ratio: 0.45        # dimensionless fraction in [0,1] (0 = healthy)
N_scale: 0.1             # dimensionless fraction (population downscaling; 1.0 = full scale)
weight_ref_scale: 0.1    # dimensionless fraction (N_scale at which weights were tuned)

simulation:
  t_sim: 2000.0          # ms
  warmup: 300.0          # ms (discarded from analysis)
  resolution: 0.1        # ms (simulation time step)
  master_seed: 55        # integer RNG seed
  n_threads: 8           # count (NEST local threads)
  V0_mean: -150.0        # mV (initial membrane potential mean)
  V0_sd: 50.0            # mV (initial membrane potential SD)

abeta:
  hyper_frac: 0.20       # dimensionless fraction of Abeta-E that is hyperactive
  I_e_hyper: 40.0        # pA (tonic current on hyperactive Abeta-E)
  I_e_supp: -100.0       # pA (tonic current on suppressed Abeta-E)

synapse:
  PSP_e: 0.1             # mV (excitatory postsynaptic potential, recurrent)
  PSP_ext: 0.1           # mV (postsynaptic potential, external input)
  g: -5.0                # dimensionless (relative inhibitory strength PSP_i/PSP_e; negative)
  PSP_rel: 0.1           # dimensionless (relative SD of synaptic weights)
  tau_syn_ex: 6.0        # ms (excitatory synaptic time constant)
  tau_syn_in: 25.0       # ms (inhibitory synaptic time constant)
  local_scaling4Eto23E: 2.0   # dimensionless weight factor (L4E -> L2/3E)
  scaling5E: 1.05        # dimensionless external-weight factor onto L5E
  scaling6E: 1.15        # dimensionless external-weight factor onto L6E
  g_inh: 0.5             # dimensionless global I->E weight factor (both conditions)
  wIE_floor: 0.4         # dimensionless I->E disinhibition floor at load=1 (1.0 = off)

delay:
  delay_e: 1.5           # ms (base excitatory dendritic delay)
  delay_i: 0.75          # ms (base inhibitory dendritic delay)
  delay_rel: 0.5         # dimensionless (relative SD of delays)
  delay_scale: 6.0       # dimensionless factor multiplying delay_e and delay_i

input:
  eta_ext: 1.1           # dimensionless (mean external drive relative to threshold V_th - E_L)

analysis:
  bands:                 # Hz [low, high] per band (used for relative band power)
    delta: [1, 4]
    theta: [4, 8]
    alpha: [8, 13]
    beta:  [13, 30]
    gamma: [30, 80]
  psd_method: welch      # categorical: 'welch' or 'fft'
  wavelet:
    fmin: 2.0            # Hz (lowest wavelet frequency)
    fmax: 80.0           # Hz (highest wavelet frequency)
    n_scales: 64         # count (log-spaced frequencies)
    w: 6.0               # dimensionless (Morlet wavelet parameter)
  plv:
    theta_band: [4, 8]   # Hz [low, high] (slow band)
    beta_band:  [13, 30] # Hz [low, high] (fast band)
    nm: [3, 1]           # dimensionless [n, m] harmonic ratio (n*f_theta ~ m*f_beta)
    theta_subfreqs: [3, 4, 5, 6, 7, 8, 9]        # Hz (comodulogram theta centre frequencies)
    beta_subfreqs:  [12, 15, 18, 21, 24, 27, 30] # Hz (comodulogram beta centre frequencies)
    sub_bw: 2.0          # Hz (bandwidth around each comodulogram sub-frequency)
